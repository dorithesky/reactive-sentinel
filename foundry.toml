[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.29"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "cancun"
fs_permissions = [{ access = "read-write", path = "./runs" }]

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = true

# Base Sepolia / Lasna RPCs are supplied through environment variables, never committed.
[profile.local]
fuzz = { runs = 256 }
